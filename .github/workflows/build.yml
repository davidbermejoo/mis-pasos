name: Compilar APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: echo "sdk.dir=$ANDROID_HOME" > local.properties && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - run: cp app/build/outputs/apk/debug/app-debug.apk MisPasos.apk
      - name: Publicar descarga
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ultima --yes --cleanup-tag || true
          gh release create ultima MisPasos.apk --title "Mis Pasos (última versión)" --notes "Descarga MisPasos.apk e instálalo en el móvil."
